apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mysnake-app
spec:
  ports:
    - port: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mysnake-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:8.2.3
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"  # Default Grafana admin password (change in production)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: mysnake-app
data:
  datasource.yaml: |
    apiVersion: 1
    kind: Datasource
    metadata:
      name: Prometheus
      namespace: monitoring
    spec:
      name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.monitoring.svc.cluster.local:9090
      isDefault: true

