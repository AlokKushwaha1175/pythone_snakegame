apiVersion: apps/v1
kind: Deployment
metadata:
  name: snake-game
  namespace: mysnake-app   # 👈 REQUIRED
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snake-game
  template:
    metadata:
      labels:
        app: snake-game
    spec:
      containers:
        - name: snake-game
          image: alok2026/flask-app:stag
          ports:
            - containerPort: 5000
          
